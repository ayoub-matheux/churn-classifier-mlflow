data:
  csv_path: "data/raw.csv"
  download_url: "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv"
  target: "Churn"
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
  categorical:
    - "gender"
    - "SeniorCitizen"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"

model:
  type: "logreg"  # options: "logreg", "random_forest"
  logreg:
    param_grid:
      model__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      model__penalty: ["l1", "l2"]
      # Both solvers support l1 and l2, so every sampled combination is valid.
      model__solver: ["liblinear", "saga"]
      model__class_weight: [null, "balanced"]
  random_forest:
    param_grid:
      model__n_estimators: [200, 400, 600]
      model__max_depth: [null, 4, 6, 8, 12]
      model__min_samples_split: [2, 5, 10, 20]
      model__min_samples_leaf: [1, 2, 4, 8]
      model__max_features: ["sqrt", "log2", null]
      model__class_weight: [null, "balanced"]

cv:
  strategy: "StratifiedKFold"
  n_splits: 5
  shuffle: true
  n_jobs: -1
  scoring: "roc_auc"
  # Fixed-budget random search covers broad spaces much more efficiently than
  # evaluating their full Cartesian product. Set search_type: grid for an
  # exhaustive, small search.
  search_type: "random"
  n_iter: 30

mlflow:
  experiment_name: "churn-classifier"
  tracking_uri: "sqlite:///mlflow.db"
  registered_model_name: "ChurnClassifier"
  stage: "Staging"
